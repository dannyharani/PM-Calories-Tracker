type User @model
  @auth(rules: [
    { allow: private, operations: [create] },
    { allow: owner, ownerField: "id", operations: [read, update, delete] }
  ])
{
  id: ID!
  email: AWSEmail!
  firstName: String
  lastName: String
  dob: AWSDate
  gender: String
  height: Float
  weight: Float
  goal: Goal
  age: Int
  goalDate: AWSDate
  calorieGoal: Int
  meals: [Meal] @hasMany
}

enum Goal {
  LOSE_WEIGHT
  MAINTAIN_WEIGHT
  GAIN_WEIGHT
  BUILD_MUSCLE
  LOSE_FAT
}

type Meal @model @auth(rules: [{allow: owner}]) {
  id: ID!
  date: AWSDateTime!
  mealType: MealType!
  calories: Int!
  estimatedIngredients: [String]
  # Optional macro breakdown estimates
  proteinGrams: Float
  carbsGrams: Float
  fatGrams: Float
  # Optional image reference (e.g., S3 key) for the meal photo
  photoKey: String
  # Confidence score (0-1) for estimates
  estimateConfidence: Float
  user: User @belongsTo
}

enum MealType {
  BREAKFAST
  LUNCH
  DINNER
  SNACK
}