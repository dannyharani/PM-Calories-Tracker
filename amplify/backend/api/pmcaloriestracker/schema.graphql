"""
Calories Tracker domain schema.

Defines User and Meal models with owner-based authorization and a one-to-many
relation (User has many Meals). Adds private read access so any signed-in user
can read User profiles while only the owner can mutate. Meal remains owner-only.
Index on Meal supports date-range queries per user.
"""

enum Goal {
  LOSE_WEIGHT
  MAINTAIN_WEIGHT
  GAIN_WEIGHT
  BUILD_MUSCLE
  LOSE_FAT
}

enum MealType {
  BREAKFAST
  LUNCH
  DINNER
  SNACK
}

type User @model
@auth(rules: [
  { allow: owner },
  { allow: private, operations: [read] }
]) {
  id: ID!
  email: AWSEmail!
  firstName: String
  lastName: String
  dob: AWSDate
  gender: String
  height: Float
  weight: Float
  goal: Goal
  age: Int
  goalDate: AWSDate
  calorieGoal: Int
  photoKey: String
  meals: [Meal] @hasMany(indexName: "byUser", fields: ["id"]) # connection via userMealsId
  createdAt: AWSDateTime
  updatedAt: AWSDateTime
}

type Meal @model
@auth(rules: [
  { allow: owner }
]) {
  id: ID!
  date: AWSDateTime!
  mealType: MealType!
  calories: Int!
  estimatedIngredients: [String]
  proteinGrams: Float
  carbsGrams: Float
  fatGrams: Float
  estimateConfidence: Float
  photoKey: String
  userMealsId: ID! @index(name: "byUser", sortKeyFields: ["date"], queryField: "mealsByUserAndDate")
  user: User @belongsTo(fields: ["userMealsId"])
  createdAt: AWSDateTime
  updatedAt: AWSDateTime
}
